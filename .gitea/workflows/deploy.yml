name: "Build and Deploy"

on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  workflow_dispatch:

concurrency:
  group: "acompanhar-deploy"
  cancel-in-progress: true

env:
  DEPLOY_HOST: vm-deploy
  DEPLOY_USER: davi
  DEPLOY_PATH: /home/davi/acompanhar
  IMAGE: localhost/acompanhar:latest

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar dependencias do sistema
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git rsync openssh-client

      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCHEME="${GITHUB_SERVER_URL%%://*}"
          SERVER="${GITHUB_SERVER_URL#*://}"
          git init -q .
          git config --global --add safe.directory "$PWD"
          git remote add origin \
            "${SCHEME}://x-access-token:${GITEA_TOKEN}@${SERVER}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin \
            "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: Configurar SSH
        env:
          DEPLOY_KEY_PRIMARY: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KEY_FALLBACK: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          KEY="${DEPLOY_KEY_PRIMARY:-$DEPLOY_KEY_FALLBACK}"
          install -m 700 -d ~/.ssh
          if [ -z "$KEY" ]; then
            echo "nenhum secret de chave definido (DEPLOY_SSH_KEY_B64 ou DEPLOY_SSH_KEY)"
            exit 1
          fi
          if printf '%s' "$KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          else
            printf '%s' "$KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "chave invalida apos decodificar (${#KEY} chars no secret)"; exit 1; }
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar codigo, buildar imagem e preparar banco (em paralelo)
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          # O rsync vem antes porque o build e o banco (database/init.sql) dependem do codigo na vm
          $SSH "$TARGET" "mkdir -p $DEPLOY_PATH/src"
          rsync -az --delete -e "$SSH" \
            --exclude .git --exclude .gitea --exclude '**/bin' --exclude '**/obj' \
            ./ "$TARGET:$DEPLOY_PATH/src/"

          # Cria o banco se nao existir, usando a connection string do acompanhar.env da vm (a mesma da app)
          cat > /tmp/preparar-banco.sh <<'EOF'
          set -euo pipefail
          CS=$(grep -E '^ConnectionStrings__AcompanharContext=' "$DEPLOY_PATH/acompanhar.env" | cut -d= -f2- || true)
          [ -n "$CS" ] || { echo "ConnectionStrings__AcompanharContext ausente em $DEPLOY_PATH/acompanhar.env"; exit 1; }
          get() { printf '%s' "$CS" | tr ';' '\n' | grep -i "^$1=" | head -1 | cut -d= -f2-; }
          export PGHOST=$(get Server) PGPORT=$(get Port) PGUSER=$(get 'User Id') PGPASSWORD=$(get Password)
          export PGPORT=${PGPORT:-5432} PGCONNECT_TIMEOUT=10
          DB=$(get Database)

          if [ "$(psql -d postgres -tAc "select 1 from pg_database where datname = '$DB'")" != "1" ]; then
            echo "criando banco $DB em $PGHOST"
            psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE \"$DB\""
          fi

          if [ "$(psql -d "$DB" -tAc "select to_regclass('public.\"Administrador\"') is not null")" != "t" ]; then
            echo "criando tabelas em $DB (database/init.sql)"
            psql -q -v ON_ERROR_STOP=1 --single-transaction -d "$DB" -f "$DEPLOY_PATH/src/database/init.sql"
          else
            echo "banco $DB ja existe em $PGHOST, nada a fazer"
          fi
          EOF

          # Build e banco rodam ao mesmo tempo; cada um grava seu proprio log para nao misturar a saida
          $SSH "$TARGET" "cd $DEPLOY_PATH/src && podman build -t $IMAGE -f AcompanharApp/Dockerfile ." \
            > /tmp/build.log 2>&1 &
          PID_BUILD=$!
          $SSH "$TARGET" "DEPLOY_PATH=$DEPLOY_PATH bash -s" < /tmp/preparar-banco.sh \
            > /tmp/banco.log 2>&1 &
          PID_BANCO=$!

          STATUS_BANCO=0; wait $PID_BANCO || STATUS_BANCO=$?
          echo "::group::Banco de dados (exit $STATUS_BANCO)"; cat /tmp/banco.log; echo "::endgroup::"
          STATUS_BUILD=0; wait $PID_BUILD || STATUS_BUILD=$?
          echo "::group::Build da imagem (exit $STATUS_BUILD)"; cat /tmp/build.log; echo "::endgroup::"

          [ $STATUS_BANCO -eq 0 ] || echo "falha ao preparar o banco de dados"
          [ $STATUS_BUILD -eq 0 ] || echo "falha no build da imagem"
          [ $STATUS_BANCO -eq 0 ] && [ $STATUS_BUILD -eq 0 ]

      - name: Publicar servico (porta 8081)
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          # Envia a definicao Quadlet do Podman e atualiza o serviço no systemd do usuario
          $SSH "$TARGET" "mkdir -p ~/.config/containers/systemd && touch $DEPLOY_PATH/acompanhar.env"
          rsync -az -e "$SSH" deploy/acompanhar.container \
            "$TARGET:.config/containers/systemd/acompanhar.container"
          $SSH "$TARGET" '
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            systemctl --user daemon-reload
            systemctl --user restart acompanhar.service 2>/dev/null || systemctl --user enable --now acompanhar.service
            systemctl --user is-active acompanhar.service
            podman image prune -f > /dev/null'

      - name: Verificar resposta HTTP
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" '
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            for i in $(seq 1 15); do
              curl -fsS -o /dev/null http://localhost:8081/ && { echo "app respondendo na 8081"; exit 0; }
              sleep 2
            done
            echo "app nao respondeu na porta 8081"
            systemctl --user status acompanhar.service --no-pager || true
            exit 1'
